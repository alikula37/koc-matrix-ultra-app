# Development overrides — `docker compose up` uses this by default (dev profile)
# Prod uses `docker compose --profile prod up -d`
services:
  backend:
    command: >
      bash -c "alembic upgrade head &&
               uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app"
    environment:
      ENV: development
      LOG_LEVEL: debug
    volumes:
      - ./backend:/app

  # frontend dev override disabled for live — use production runner (node server.js)
  # To enable hot-reload, add dev stage to Dockerfile and uncomment below:
  # frontend:
  #   build:
  #     context: ./frontend
  #     target: dev
  #   command: npm run dev
  #   environment:
  #     NODE_ENV: development
  #   volumes:
  #     - ./frontend:/app
  #     - /app/node_modules
  #     - /app/.next
