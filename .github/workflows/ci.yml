name: CI — test & build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: koc_matrix
          POSTGRES_PASSWORD: koc_matrix_secret_2025
          POSTGRES_DB: koc_matrix_ultra_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r backend/requirements.txt
      - run: alembic upgrade head
        working-directory: backend
        env:
          DATABASE_URL_SYNC: postgresql+psycopg2://koc_matrix:koc_matrix_secret_2025@localhost:5432/koc_matrix_ultra_test
      - run: python -m pytest app/tests -v
        working-directory: backend
      - run: python seed.py
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://koc_matrix:koc_matrix_secret_2025@localhost:5432/koc_matrix_ultra_test
          DATABASE_URL_SYNC: postgresql+psycopg2://koc_matrix:koc_matrix_secret_2025@localhost:5432/koc_matrix_ultra_test

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package.json }
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  docker-compose-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config
      - run: docker compose up -d db && sleep 10 && docker compose ps
      - run: docker compose logs db
      - run: docker compose down -v
