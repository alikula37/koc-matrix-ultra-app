services:
  db:
    image: postgres:16-alpine
    container_name: koc-matrix-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-koc_matrix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-koc_matrix_secret_2025}
      POSTGRES_DB: ${POSTGRES_DB:-koc_matrix_ultra}
      TZ: Europe/Istanbul
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-koc_matrix} -d ${POSTGRES_DB:-koc_matrix_ultra}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - koc_matrix_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: koc-matrix-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://koc_matrix:koc_matrix_secret_2025@db:5432/koc_matrix_ultra
      DATABASE_URL_SYNC: postgresql+psycopg2://koc_matrix:koc_matrix_secret_2025@db:5432/koc_matrix_ultra
      SECRET_KEY: ${SECRET_KEY:-change-me-32chars-minimum-secret-key-12345}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://frontend:3000}
      WEBHOOK_ENABLED: ${WEBHOOK_ENABLED:-false}
      TZ: Europe/Istanbul
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - backend_media:/app/media
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - koc_matrix_net
    command: >
      bash -c "alembic upgrade head &&
               uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: koc-matrix-frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
      TZ: Europe/Istanbul
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - koc_matrix_net

  backup:
    build:
      context: ./backup
      dockerfile: Dockerfile
    container_name: koc-matrix-backup
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-koc_matrix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-koc_matrix_secret_2025}
      POSTGRES_DB: ${POSTGRES_DB:-koc_matrix_ultra}
      PGHOST: db
      BACKUP_CRON: ${BACKUP_CRON:-0 3 * * *}
      BACKUP_RETENTION_DAYS: 30
      RCLONE_ENABLED: ${RCLONE_ENABLED:-false}
      TZ: Europe/Istanbul
    volumes:
      - ./backups:/backups
      - pg_data:/var/lib/postgresql/data:ro
    networks:
      - koc_matrix_net

  caddy:
    image: caddy:2-alpine
    container_name: koc-matrix-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    networks:
      - koc_matrix_net
    profiles:
      - prod

volumes:
  pg_data:
    name: koc_matrix_pg_data
  caddy_data:
  caddy_config:
  backend_media:

networks:
  koc_matrix_net:
    driver: bridge
